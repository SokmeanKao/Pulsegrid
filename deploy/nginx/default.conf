# Pulsegrid Monitor edge proxy — single HTTP port for UI + API + WebSocket.
# Agent Gateway (gRPC TLS) stays on :50051 directly on the backend container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pulsegrid_dashboard {
    server dashboard:3000;
}

upstream pulsegrid_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16m;

    # Backend API + health (Next.js config is at /pulsegrid-config, not under /api)
    location /api/ {
        proxy_pass http://pulsegrid_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://pulsegrid_backend/healthz;
        proxy_set_header Host $host;
    }

    # Live metrics WebSocket
    location /ws/ {
        proxy_pass http://pulsegrid_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dashboard (Next.js) — /terminal, /pulsegrid-config, static assets
    location / {
        proxy_pass http://pulsegrid_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
