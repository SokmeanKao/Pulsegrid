syntax = "proto3";

package pulsegrid.v1;

option go_package = "github.com/pulsegrid/agent/internal/pb";
option java_multiple_files = true;
option java_package = "com.monitoring.backend.grpc.gen";
option java_outer_classname = "MonitoringProto";

// Agent dials Monitor. Monitor is the gRPC server.
service AgentGateway {
  rpc Connect(stream AgentMessage) returns (stream MonitorMessage);
}

message AgentHello {
  string server_id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string agent_version = 5;
  string join_token = 6; // required for unregistered hosts
}

message Heartbeat {
  int64 unix_ms = 1;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string message = 3;
}

message AgentMessage {
  oneof payload {
    AgentHello hello = 1;
    MetricsEnvelope metrics = 2;
    Heartbeat heartbeat = 3;
    CommandResult command_result = 4;
  }
}

message Welcome {
  bool accepted = 1;
  uint32 heartbeat_interval_seconds = 2;
  uint32 metrics_interval_seconds = 3;
}

message Reject {
  string code = 1;
  string message = 2;
}

message ConfigUpdate {
  uint32 metrics_interval_seconds = 1;
  uint32 heartbeat_interval_seconds = 2;
}

message AgentCommand {
  string command_id = 1;
  string type = 2;
  string payload_json = 3;
}

message MonitorMessage {
  oneof payload {
    Welcome welcome = 1;
    Reject reject = 2;
    ConfigUpdate config_update = 3;
    AgentCommand command = 4;
  }
}

message HostInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string platform = 4;
}

message AgentInfo {
  string version = 1;
  string go_version = 2;
  int64 started_at_unix_ms = 3;
  uint64 samples_sent = 4;
}

message CpuMetrics {
  double usage_percent = 1;
  uint32 logical_cores = 2;
  double load1 = 3;
  double load5 = 4;
  double load15 = 5;
  // Per logical core utilization (0–100), same order as gopsutil percpu.
  repeated double per_core_percent = 6;
}

message MemoryMetrics {
  double total_mb = 1;
  double used_mb = 2;
  double available_mb = 3;
  double cached_mb = 4;
  double swap_total_mb = 5;
  double swap_used_mb = 6;
}

message DiskMetrics {
  string mount = 1;
  string device = 2;
  double used_gb = 3;
  double total_gb = 4;
  double read_bytes_per_sec = 5;
  double write_bytes_per_sec = 6;
  double read_ops_per_sec = 7;
  double write_ops_per_sec = 8;
}

message NetworkMetrics {
  string interface_name = 1;
  double rx_bytes_per_sec = 2;
  double tx_bytes_per_sec = 3;
  double rx_packets_per_sec = 4;
  double tx_packets_per_sec = 5;
  uint64 rx_errors = 6;
  uint64 tx_errors = 7;
  uint64 rx_dropped = 8;
  uint64 tx_dropped = 9;
  uint64 rx_bytes_total = 10;
  uint64 tx_bytes_total = 11;
}

message ProcessMetrics {
  int32 pid = 1;
  string name = 2;
  double cpu_percent = 3;
  double memory_mb = 4;
  int32 ppid = 5;
  string user = 6;
  // RUNNING | SLEEPING | ZOMBIE | STOPPED | IDLE | UNKNOWN
  string state = 7;
  uint32 thread_count = 8;
  uint64 rss_bytes = 9;
  uint64 vms_bytes = 10;
  double read_bytes_per_sec = 11;
  double write_bytes_per_sec = 12;
  int64 start_time_unix_ms = 13;
  // Truncated cmdline for stream (full command via GetProcessDetails later).
  string command = 14;
}

message ProcessSummary {
  uint32 total = 1;
  uint32 running = 2;
  uint32 sleeping = 3;
  uint32 zombie = 4;
  uint32 stopped = 5;
  uint32 idle = 6;
  uint32 other = 7;
  uint32 threads = 8;
}

message HostExtras {
  uint64 uptime_seconds = 1;
  double load1 = 2;
  double load5 = 3;
  double load15 = 4;
  bool load_available = 5;
}

message DockerContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  double cpu_percent = 5;
  double memory_mb = 6;
}

message DockerSummary {
  bool available = 1;
  string server_version = 2;
  uint32 containers_running = 3;
  uint32 containers_paused = 4;
  uint32 containers_stopped = 5;
  uint32 images = 6;
  repeated DockerContainer top_containers = 7;
  string error_message = 8;
}

message GpuSensor {
  string name = 1;
  double utilization_percent = 2;
  double memory_used_mb = 3;
  double memory_total_mb = 4;
  double temperature_c = 5;
}

message TempSensor {
  string name = 1;
  double celsius = 2;
}

message SensorSummary {
  repeated GpuSensor gpus = 1;
  repeated TempSensor temperatures = 2;
}

message MetricsEnvelope {
  string server_id = 1;
  int64 collected_at_unix_ms = 2;
  uint64 sequence = 3;
  HostInfo host = 4;
  CpuMetrics cpu = 5;
  MemoryMetrics memory = 6;
  repeated DiskMetrics disks = 7;
  repeated NetworkMetrics networks = 8;
  repeated ProcessMetrics top_processes = 9;
  AgentInfo agent = 10;
  ProcessSummary process_summary = 11;
  HostExtras host_extras = 12;
  DockerSummary docker = 13;
  SensorSummary sensors = 14;
}
