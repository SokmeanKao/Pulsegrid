server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pulsegrid}
spring.datasource.username=${DATABASE_USER:pulsegrid}
spring.datasource.password=${DATABASE_PASSWORD:pulsegrid}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Agent Gateway (TLS) — agents dial this, Monitor never dials agents
GATEWAY_PORT=${GATEWAY_PORT:50051}
GATEWAY_TLS_CERT=${GATEWAY_TLS_CERT:certs/server.crt}
GATEWAY_TLS_KEY=${GATEWAY_TLS_KEY:certs/server.key}
GATEWAY_CA_CERT=${GATEWAY_CA_CERT:certs/ca.crt}
GATEWAY_ADVERTISE_HOST=${GATEWAY_ADVERTISE_HOST:localhost}
