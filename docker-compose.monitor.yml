# Pulsegrid Monitor — DB + one unified app image (UI + API + Agent Gateway).
#
# Minimal setup (certs auto-generated on first start):
#   mkdir pulsegrid-monitor && cd pulsegrid-monitor
#   curl -fsSL https://raw.githubusercontent.com/SokmeanKao/Pulsegrid/main/docker-compose.monitor.yml -o docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/SokmeanKao/Pulsegrid/main/deploy/monitor/env.example -o .env
#   # edit GATEWAY_ADVERTISE_HOST=your.ip
#   docker compose up -d
#
# Or one-liner: scripts/install-monitor-images.sh|.ps1
#
# If pull says "not found": make ghcr.io/.../pulsegrid-monitor Public
# (GitHub → Packages → package settings), or docker login ghcr.io.
#
# Host ports (defaults avoid Windows :80 lock):
#   HTTP_PORT (8080)     → UI + API + WebSocket
#   GATEWAY_PORT (50051) → Agent Gateway TLS

name: pulsegrid-monitor

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pulsegrid
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
    volumes:
      - pulsegrid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  monitor:
    image: ghcr.io/${PULSEGRID_IMAGE_OWNER:-sokmeankao}/pulsegrid-monitor:${PULSEGRID_VERSION:-latest}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/pulsegrid
      DATABASE_USER: pulsegrid
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
      GATEWAY_PORT: "50051"
      GATEWAY_TLS_CERT: /certs/server.crt
      GATEWAY_TLS_KEY: /certs/server.key
      GATEWAY_CA_CERT: /certs/ca.crt
      GATEWAY_CERT_DIR: /certs
      GATEWAY_ADVERTISE_HOST: ${GATEWAY_ADVERTISE_HOST:-localhost}
      PULSEGRID_SAME_ORIGIN: "true"
      PULSEGRID_UI_DIR: file:/app/ui/
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GATEWAY_PORT:-50051}:50051"
    volumes:
      # Named volume: entrypoint auto-creates TLS on first boot.
      # To use host files instead: - ./certs:/certs
      - pulsegrid-certs:/certs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulsegrid-db:
  pulsegrid-certs:
