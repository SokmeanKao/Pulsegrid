# Pulsegrid Monitor (control plane): db + backend + dashboard
# Agents run separately on each host — see scripts/install-agent.sh
#
# Monitor only:
#   docker compose up -d --build
#
# Monitor + demo in-compose agents (fake fleet):
#   AGENTS=web-01:agent-web-01:50051,db-01:agent-db-01:50052 \
#     docker compose --profile demo up -d --build

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pulsegrid
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulsegrid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Comma list: id:host:port — real agents on LAN/host, not in this compose by default
      AGENTS: ${AGENTS:-}
      DATABASE_URL: jdbc:postgresql://db:5432/pulsegrid
      DATABASE_USER: pulsegrid
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/metrics}
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/metrics}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # --- optional demo agents (profile: demo) — container metrics only ---
  agent-web-01:
    profiles: ["demo"]
    build: ./agent
    environment:
      PORT: "50051"
      SERVER_ID: web-01
    expose:
      - "50051"
    restart: unless-stopped

  agent-db-01:
    profiles: ["demo"]
    build: ./agent
    environment:
      PORT: "50052"
      SERVER_ID: db-01
    expose:
      - "50052"
    restart: unless-stopped

volumes:
  pulsegrid-db:
