# Pulsegrid Monitor (control plane): db + backend + dashboard + Agent Gateway
# Agents dial Monitor :50051 (TLS) — see scripts/install-agent.sh
#
#   docker compose up -d --build
#
# Demo agents (client mode, profile demo):
#   docker compose --profile demo up -d --build

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pulsegrid
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulsegrid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/pulsegrid
      DATABASE_USER: pulsegrid
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid}
      GATEWAY_PORT: "50051"
      GATEWAY_TLS_CERT: /certs/server.crt
      GATEWAY_TLS_KEY: /certs/server.key
      GATEWAY_CA_CERT: /certs/ca.crt
      GATEWAY_ADVERTISE_HOST: ${GATEWAY_ADVERTISE_HOST:-localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${GATEWAY_PORT:-50051}:50051"
    volumes:
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/metrics}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/metrics}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Demo agents dial the gateway (need pre-enrolled tokens via DEMO bootstrap or UI)
  agent-web-01:
    profiles: ["demo"]
    build: ./agent
    environment:
      SERVER_ID: web-01
      MONITOR_ADDRESS: backend:50051
      JOIN_TOKEN: ${DEMO_JOIN_TOKEN_WEB:-}
      MONITOR_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  agent-db-01:
    profiles: ["demo"]
    build: ./agent
    environment:
      SERVER_ID: db-01
      MONITOR_ADDRESS: backend:50051
      JOIN_TOKEN: ${DEMO_JOIN_TOKEN_DB:-}
      MONITOR_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pulsegrid-db:
