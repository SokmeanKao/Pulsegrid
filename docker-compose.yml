services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pulsegrid
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: pulsegrid
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-web-01:
    build: ./agent
    environment:
      - PORT=50051
      - SERVER_ID=web-01
    expose:
      - "50051"

  agent-db-01:
    build: ./agent
    environment:
      - PORT=50052
      - SERVER_ID=db-01
    expose:
      - "50052"

  backend:
    build: ./backend
    environment:
      - AGENTS=web-01:agent-web-01:50051,db-01:agent-db-01:50052
      - DATABASE_URL=jdbc:postgresql://db:5432/pulsegrid
      - DATABASE_USER=pulsegrid
      - DATABASE_PASSWORD=pulsegrid
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      agent-web-01:
        condition: service_started
      agent-db-01:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws/metrics
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws/metrics
    ports:
      - "3000:3000"
    depends_on:
      - backend
