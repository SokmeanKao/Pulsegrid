name: Release pulsegrid-monitor

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image owner
        id: image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "monitor=${{ env.REGISTRY }}/${OWNER_LC}/pulsegrid-monitor" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push unified monitor image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: monitor/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.monitor }}:${{ steps.ver.outputs.tag }}
            ${{ steps.image.outputs.monitor }}:latest

      # GHCR packages default to private; anonymous docker pull then looks like "not found".
      - name: Make package public (anonymous pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PKG="pulsegrid-monitor"
          # User-owned packages use /user/... ; org-owned use /orgs/{org}/...
          if gh api "users/${OWNER}" --jq .type | grep -qi Organization; then
            ENDPOINT="orgs/${OWNER}/packages/container/${PKG}"
          else
            ENDPOINT="user/packages/container/${PKG}"
          fi
          gh api --method PATCH "$ENDPOINT" -f visibility=public \
            || echo "::warning::Could not set package public. In GitHub: Packages → pulsegrid-monitor → Package settings → Change visibility → Public"
