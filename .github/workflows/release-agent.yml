name: Release pulsegrid-agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pulsegrid-agent

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.sum

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        working-directory: agent
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/pulsegrid/agent/internal/metrics.AgentVersion=${VERSION}"

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" \
            -o dist/pulsegrid-agent-linux-amd64 ./cmd/pulsegrid-agent
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" \
            -o dist/pulsegrid-agent-linux-arm64 ./cmd/pulsegrid-agent
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" \
            -o dist/pulsegrid-agent-windows-amd64.exe ./cmd/pulsegrid-agent

          cd dist
          sha256sum pulsegrid-agent-* > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: pulsegrid-agent ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            agent/dist/pulsegrid-agent-linux-amd64
            agent/dist/pulsegrid-agent-linux-arm64
            agent/dist/pulsegrid-agent-windows-amd64.exe
            agent/dist/SHA256SUMS
          body: |
            ## Install (Linux one-liner)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-agent.sh \
              | sudo bash -s -- --server-id YOUR_HOST_ID --version ${{ steps.ver.outputs.tag }}
            ```

            ## Container (GHCR)

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/pulsegrid-agent:${{ steps.ver.outputs.tag }}
            docker run --rm --net=host \
              -e SERVER_ID=YOUR_HOST_ID -e PORT=50051 \
              ghcr.io/${{ github.repository_owner }}/pulsegrid-agent:${{ steps.ver.outputs.tag }}
            ```

      - name: Lowercase image owner
        id: image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
